<!doctype html>
<html lang="uz" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sun'iy intellekt: ish quroli</title>
<meta name="description" content="Ro'zillo aka jamoasi uchun 6 darslik amaliy AI kursi: ChatGPT, Gemini, Claude Code.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1020;--bg2:#0f1830;--card:#131d36;--line:#23304f;--tx:#eef2ff;--mut:#9aa8c9;--or:#ff9f43;--bl:#6b95ff;--gr:#3ecf8e;--pk:#ff6b9d;--code:#0a0f1d}
:root[data-theme=light]{--bg:#f4f6fb;--bg2:#fff;--card:#fff;--line:#d3d9ea;--tx:#0e1730;--mut:#44506e;--code:#0e1730;--or:#d4690a;--bl:#2a55d4;--gr:#0f8a53;--pk:#d02e69}
:root[data-theme=light] .card{box-shadow:0 2px 10px rgba(30,50,100,.07)}
:root[data-theme=light] .note{background:#e6f7ee;color:#0b3d27}
:root[data-theme=light] .code .c{color:#8fa0c8}

*{box-sizing:border-box;margin:0;padding:0}
.slide{position:absolute;inset:0;padding:54px 72px 64px;display:none;flex-direction:column;justify-content:center;gap:22px}
.slide.on{display:flex;animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.kick{font-size:18px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--or)}
h1{font-size:78px;line-height:1.04;font-weight:900;letter-spacing:-.02em}
h2{font-size:50px;line-height:1.1;font-weight:900;letter-spacing:-.01em}
h3{font-size:28px;font-weight:800}
h3 a{color:var(--tx);text-decoration:none}h3 a:hover{color:var(--bl)}
p,li{font-size:26px;line-height:1.45;color:var(--mut)}
b,strong{color:var(--tx)}
.acc{color:var(--bl)}.or{color:var(--or)}.gr{color:var(--gr)}.pk{color:var(--pk)}
.lead{font-size:30px;color:var(--mut);max-width:900px}
.grid{display:grid;gap:18px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px}
.card h3{margin:6px 0 8px}.card p,.card li{font-size:23px}
.card.hl{border-color:var(--or);box-shadow:0 0 0 1px var(--or) inset}
.tag{display:inline-block;font-size:15px;font-weight:900;letter-spacing:.08em;padding:4px 10px;border-radius:99px;text-transform:uppercase}
.t-or{background:rgba(255,159,67,.18);color:var(--or)}.t-bl{background:rgba(107,149,255,.18);color:var(--bl)}.t-gr{background:rgba(62,207,142,.18);color:var(--gr)}.t-pk{background:rgba(255,107,157,.18);color:var(--pk)}
ul{list-style:none;display:grid;gap:8px}
ul li{padding-left:26px;position:relative}
ul li:before{content:"";position:absolute;left:4px;top:.6em;width:9px;height:9px;border-radius:50%;background:var(--bl)}
.ok li:before{background:var(--gr)}.no li:before{background:var(--pk)}
.num{font-size:68px;font-weight:900;line-height:1}
.letter{font-size:76px;font-weight:900;line-height:1}
.code{background:var(--code);border:1px solid var(--line);border-radius:14px;padding:18px 22px;font-family:'JetBrains Mono',monospace;font-size:21px;line-height:1.55;color:#cfe0ff;white-space:pre-wrap}
:root[data-theme=light] .code{color:#cfe0ff}
.code .k{color:var(--or)}.code .c{color:#7a8bb3}.code .g{color:var(--gr)}
.steps{display:grid;gap:14px;counter-reset:s}
.steps>div{counter-increment:s;display:flex;gap:18px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px}
.steps>div:before{content:counter(s);flex:none;width:46px;height:46px;border-radius:50%;background:var(--bl);color:#fff;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center}
.steps p{font-size:24px}.steps b{font-size:26px}
.steps{gap:10px}.steps>div{padding:10px 20px}.steps p{line-height:1.3}
.steps:has(>div:nth-child(5)) p{font-size:22px}.steps:has(>div:nth-child(5)) b{font-size:24px}.steps:has(>div:nth-child(5))>div{padding:8px 20px}
.bar{display:flex;height:64px;border-radius:14px;overflow:hidden;font-weight:800;color:#0a1020}
.bar div{display:flex;flex-direction:column;justify-content:center;padding:0 16px;font-size:17px}.bar div b{font-size:28px;color:#0a1020}
table{width:100%;border-collapse:collapse;font-size:23px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--or)}
td{color:var(--mut)}td:first-child{color:var(--tx);font-weight:800}
.quote{border-left:5px solid var(--or);padding:10px 22px;font-size:30px;font-weight:700;color:var(--tx)}
.chip{display:inline-block;padding:5px 12px;border-radius:99px;font-size:17px;font-weight:800}
.div{align-items:flex-start;justify-content:center;gap:16px}
.div .big{font-size:230px;font-weight:900;line-height:.8;color:transparent;-webkit-text-stroke:3px var(--bl);position:absolute;right:60px;top:70px;opacity:.55}
.wow{margin-top:18px;background:linear-gradient(135deg,rgba(255,159,67,.18),rgba(255,107,157,.12));border:1px solid var(--or);border-radius:18px;padding:18px 26px;max-width:860px}
.wow .kick{margin-bottom:4px}.wow p{color:var(--tx);font-size:27px;font-weight:700}
.mock{background:#fff;border-radius:14px;overflow:hidden;color:#0e1730;border:1px solid var(--line)}
.mock .top{background:#0e1730;color:#fff;padding:10px 16px;font-weight:800;display:flex;justify-content:space-between;font-size:19px}
.mock table{font-size:18px}.mock td{color:#334}.mock td:first-child{color:#0e1730}.mock th{color:#6b7694}
.st{padding:3px 10px;border-radius:99px;font-size:15px;font-weight:900}
.s-ok{background:#d9f7e8;color:#0d7a4a}.s-late{background:#ffe0e0;color:#b3261e}.s-act{background:#dfe8ff;color:#2848b0}
.note{display:none;position:absolute;left:72px;right:72px;bottom:70px;background:#1b2a1f;border:1px solid var(--gr);color:#d6ffe8;border-radius:12px;padding:12px 18px;font-size:20px;line-height:1.4;z-index:5}
body.notes .note{display:block}
.sp{flex:1}
html{background:var(--bg);scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:Nunito,system-ui,sans-serif;min-height:100vh}
a{color:inherit}
button{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0}
.brand{font-weight:900;font-size:19px;letter-spacing:.02em}
.brand b{color:var(--or)}
.btn{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:10px 18px;font:800 17px Nunito,system-ui,sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--or)}
.btn.pri{background:var(--or);border-color:var(--or);color:#fff}
.btn.pri:hover{filter:brightness(1.06)}
.eyebrow{font-size:16px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--or)}
/* home */
.hs h1{font-size:60px}.hs h2{font-size:40px}.hs h3{font-size:24px}.hs p,.hs li{font-size:21px}.hs .lead{font-size:24px}.hs .card p,.hs .card li{font-size:19px}
.hs .num{font-size:52px}.hs .kick{font-size:16px}
.hs{display:flex;flex-direction:column;gap:20px;padding:30px 0}
.hs .big{display:none}
.hero{padding:26px 0 8px;display:flex;flex-direction:column;gap:18px}
.hero .actions{display:flex;gap:12px;flex-wrap:wrap}
.module{padding:34px 0 8px}
.module-h{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.module-h h2{font-size:38px}
.module-h p{font-size:21px;color:var(--mut)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.lcard{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:10px;cursor:pointer;color:var(--tx);font:inherit;transition:transform .15s,border-color .15s,box-shadow .15s;box-shadow:0 2px 10px rgba(30,50,100,.07)}
.lcard:hover{transform:translateY(-3px);border-color:var(--bl);box-shadow:0 10px 26px rgba(30,50,100,.14)}
.lcard .n{width:54px;height:54px;border-radius:16px;background:var(--bl);color:#fff;font-weight:900;font-size:28px;display:flex;align-items:center;justify-content:center}
.lcard h3{font-size:26px;line-height:1.15}
.lcard p{font-size:19px;line-height:1.4;color:var(--mut)}
.lcard .meta{font-size:15px;font-weight:800;color:var(--mut);margin-top:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.lcard .chip{background:rgba(42,85,212,.10);color:var(--bl);font-size:14px;padding:4px 10px}
:root:not([data-theme=light]) .lcard .chip{background:rgba(107,149,255,.18)}
.about{margin:44px 0 20px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px 32px;display:flex;flex-direction:column;gap:14px}
.about h2{font-size:36px}
.about p{font-size:21px;color:var(--mut)}
.contact{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:6px}
.contact a{text-decoration:none;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.contact a:hover{border-color:var(--or)}
.contact small{font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.contact b{font-size:20px}
.foot{padding:20px 0 50px;font-size:15px;color:var(--mut)}
/* lesson view */
.lhead{display:flex;align-items:center;gap:16px;padding:18px 0 14px;flex-wrap:wrap}
.lhead .tt{flex:1;min-width:240px}
.lhead .tt small{display:block;font-weight:900;letter-spacing:.14em;color:var(--or);font-size:14px}
.lhead .tt h1{font-size:34px;line-height:1.1}
#player{position:relative;width:100%;overflow:hidden;border-radius:20px;border:1px solid var(--line);box-shadow:0 12px 40px rgba(30,50,100,.16);background:var(--bg)}
#player:fullscreen{border:0;border-radius:0;box-shadow:none}
#stage{width:1280px;height:720px;position:absolute;left:0;top:0;transform-origin:0 0;background:radial-gradient(1100px 600px at 85% -10%,rgba(42,85,212,.10),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(212,105,10,.08),transparent 60%),var(--bg);overflow:hidden}
:root:not([data-theme=light]) #stage{background:radial-gradient(1100px 600px at 85% -10%,rgba(107,149,255,.18),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(255,159,67,.13),transparent 60%),var(--bg)}
#ctl{display:flex;align-items:center;gap:12px;padding:14px 0}
.dots{flex:1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dot{width:14px;height:14px;border-radius:50%;border:0;padding:0;cursor:pointer;opacity:.35;transition:transform .15s,opacity .15s}
.dot.on{opacity:1;transform:scale(1.35)}
.dot:hover{opacity:.8}
.k-theory{background:var(--bl)}.k-task{background:var(--or)}.k-end{background:var(--gr)}.k-safe{background:var(--pk)}.k-cover{background:var(--tx)}
#cnt{font-weight:800;font-size:17px;color:var(--mut);min-width:70px;text-align:center}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:15px;font-weight:700;color:var(--mut);padding-bottom:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.outline{margin:22px 0}
.outline h2{font-size:30px;margin-bottom:14px}
.ol{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 18px}
.ol button{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font:700 17px Nunito,system-ui,sans-serif;color:var(--tx);cursor:pointer}
.ol button:hover{border-color:var(--bl)}
.ol button.on{border-color:var(--or);box-shadow:0 0 0 1px var(--or) inset}
.ol .i{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#fff}
.ol small{display:block;font-size:12px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
.nextl{margin:10px 0 40px}
@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.contact{grid-template-columns:1fr 1fr}.ol{grid-template-columns:1fr}.hs .g3,.hs .g4,.hs .g2{grid-template-columns:1fr 1fr}.hs h1{font-size:44px}}
@media(max-width:600px){.cards,.contact,.hs .g3,.hs .g4,.hs .g2{grid-template-columns:1fr}.hs h1{font-size:36px}.hs h2{font-size:30px}.lhead .tt h1{font-size:26px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const S=[],LES=[]; // slides
const add=(h,n,cls)=>S.push({h,n:n||'',cls:cls||''});
const div=(n,t,goal,wow,note)=>{LES[n-1]={t,goal,wow,start:S.length};add(`<div class="big">${n}</div><div class="kick">${n}-dars</div><h1>${t}</h1><p class="lead">${goal}</p><div class="wow"><div class="kick">Bugungi «VAU»</div><p>${wow}</p></div>`,note,'div');}

/* ===== KIRISH ===== */
add(`<div class="kick">Ro'zillo aka jamoasi uchun · 6 dars</div><h1>Sun'iy intellekt:<br><span class="acc">ish quroli</span></h1><p class="lead">Drabilka, xo'jalik mollari do'koni va opalubka ijarasi uchun amaliy kurs. AI ga yozishdan tortib, o'zingizning dasturingizni yasashgacha.</p><div class="grid g4" style="margin-top:10px"><div class="card"><span class="tag t-or">ChatGPT</span></div><div class="card"><span class="tag t-bl">Gemini</span></div><div class="card"><span class="tag t-gr">Claude</span></div><div class="card"><span class="tag t-pk">Claude Code</span></div></div>`,'Boshlashdan oldin: bu kurs nazariya emas, har dars oxirida korxonaga yaraydigan tayyor natija chiqadi. Shuni ayting.');
add(`<div class="kick">Nega bu kurs</div><h2>AI sizning jamoangizda <span class="acc">4 ta ishchi</span> bo'ladi</h2><div class="grid g4"><div class="card"><div class="num or">1</div><h3>Yozadi</h3><p>Shartnoma, e'lon, mijozga xabar, xitoycha xat</p></div><div class="card"><div class="num acc">2</div><h3>Hisoblaydi</h3><p>Ijara summasi, tannarx, foyda, Excel formulalari</p></div><div class="card"><div class="num gr">3</div><h3>O'qiydi</h3><p>Dastgoh pasporti, rasm, PDF, jadval, video</p></div><div class="card"><div class="num pk">4</div><h3>Yasaydi</h3><p>Hisob dasturi, bot, sayt. Kod yozmasdan</p></div></div>`);
add(`<div class="kick">Kurs xaritasi</div><h2>6 dars, <span class="acc">6 ta tayyor natija</span></h2><div class="grid g3"><div class="card hl"><span class="tag t-or">1-dars</span><h3>AI bilan ishlash</h3><p>Google orqali kirish, R-V-K-F formulasi</p></div><div class="card"><span class="tag t-bl">2-dars</span><h3>Dunyo va Xitoy texnikasi</h3><p>Dastgohlarni topish, solishtirish, tarjima</p></div><div class="card"><span class="tag t-gr">3-dars</span><h3>Hujjat va jadval</h3><p>Shartnoma, narx ro'yxati, ijara kalkulyatori</p></div><div class="card"><span class="tag t-pk">4-dars</span><h3>Claude Code</h3><p>O'rnatish, kompyuterni boshqarish</p></div><div class="card"><span class="tag t-or">5-dars</span><h3>1-dastur: ijara tizimi</h3><p>Opalubka ijarasini hisoblaydigan dastur</p></div><div class="card"><span class="tag t-bl">6-dars</span><h3>2-dastur va chiqarish</h3><p>Do'kon, drabilka yoki bot. Himoya va sertifikat</p></div></div>`);
add(`<div class="kick">Kurs oxirida</div><h2>Siz bularni <span class="gr">qila olasiz</span></h2><div class="grid g2"><ul class="ok"><li>ChatGPT, Gemini va Claude'ga kirish va to'g'ri so'rov yozish</li><li>Xitoy dastgohlarini topish, tarjima qilish, solishtirish</li><li>Shartnoma va hisobotni AI bilan 5 daqiqada tayyorlash</li></ul><ul class="ok"><li>Claude Code'ni o'rnatish va o'zingiz ishlatish</li><li>Kompyuterni AI ga boshqartirish</li><li>O'z korxonangiz uchun ishlaydigan dastur yasash</li></ul></div>`);
add(`<div class="kick">Dars tartibi</div><h2>Har dars <span class="acc">1 soatdan 2 soatgacha</span></h2><div class="bar"><div style="background:#eef2ff;width:12%"><b>15</b>nazariya</div><div style="background:#ff9f43;width:18%"><b>20</b>namoyish</div><div style="background:#6b95ff;width:50%"><b>60</b>o'zingiz qilasiz</div><div style="background:#3ecf8e;width:12%"><b>15</b>natija</div><div style="background:#ff6b9d;width:8%"><b>10</b>vazifa</div></div><p>Yuqoridagi taqsimot 2 soatlik dars uchun. 1 soatlik darsda: 10 nazariya, 10 namoyish, 25 o'zingiz qilasiz, 10 natija, 5 vazifa. Har dars bitta aniq natija bilan tugaydi. O'z noutbukingizda, o'z ishingiz misolida ishlaysiz. Ko'rib qo'ya qolmaysiz, o'zingiz bosasiz.</p>`);
add(`<div class="kick">Tayyorgarlik</div><h2>Birinchi darsgacha <span class="or">nima kerak</span></h2><div class="grid g4"><div class="card"><h3>Noutbuk</h3><p>Windows yoki Mac, internet bilan</p></div><div class="card"><h3>Gmail</h3><p>Shaxsiy Google akkaunt. Yo'q bo'lsa 1-darsda ochamiz</p></div><div class="card"><h3>Telefon</h3><p>Tasdiqlash kodi keladigan raqam bilan</p></div><div class="card"><h3>Visa karta</h3><p>4-darsdan oldin kerak. Pullik obuna uchun</p></div></div>`,'Obuna to\'lovi uchun karta masalasini oldindan hal qilishni ayting. Hududda xizmatlar mavjudligini oldindan tekshiring.');

/* ===== 1-DARS ===== */
div('1','AI bilan ishlash','Akkauntga kirish, AI ni tanlash va to\'g\'ri so\'rov yozish formulasi.','Bir daqiqada mijozga tayyor, chiroyli narx e\'loni yozdirib ko\'rasiz.');
add(`<div class="kick">1-dars · Asos</div><h2>AI nima? <span class="acc">3 oddiy qoida</span></h2><div class="grid g3"><div class="card"><div class="num or">1</div><h3>U yordamchi</h3><p>O'ta bilimli, lekin sizning korxonangizni bilmaydi. Hammasini tushuntirish kerak.</p></div><div class="card"><div class="num acc">2</div><h3>U xato qiladi</h3><p>Ishonch bilan noto'g'ri gapirishi mumkin. Narx va raqamni doim tekshiring.</p></div><div class="card"><div class="num pk">3</div><h3>U sir saqlamaydi</h3><p>Parol, karta raqami va mijoz sirlarini yozmang.</p></div></div>`);
add(`<div class="kick">1-dars · Tanlov</div><h2>Qaysi AI <span class="acc">nima uchun</span></h2><div class="card"><table><tr><th>AI</th><th>Kuchli tomoni</th><th>Bizda qayerda</th></tr><tr><td>ChatGPT</td><td>Yozish, g'oya, ovozli suhbat</td><td>Mijozga xabar, e'lon</td></tr><tr><td>Gemini</td><td>Google bilan bog'liq, rasm va video, tarjima</td><td>Xitoycha pasport, Sheets</td></tr><tr><td>Claude</td><td>Uzun hujjat, aniq yozuv, kod</td><td>Shartnoma, tahlil</td></tr><tr><td>Claude Code</td><td>Kompyuteringizda ishlaydi, dastur yasaydi</td><td>4-6 darslar</td></tr></table></div><p>Bittasini yaxshi o'rganing, qolganlarini solishtirish uchun ishlating.</p>`);
add(`<div class="kick">1-dars · Kirish 1/3</div><h2>Google akkaunt <span class="acc">tayyorlaymiz</span></h2><div class="steps"><div><span><b>accounts.google.com</b><p>Yangi akkaunt oching yoki bor Gmail'dan foydalaning.</p></span></div><div><span><b>Kuchli parol</b><p>Kamida 12 belgi, ism va tug'ilgan yilsiz. Daftarga emas, parol menejeriga saqlang.</p></span></div><div><span><b>2 bosqichli tasdiq (2FA)</b><p>Google sozlamalarida Xavfsizlik, keyin 2 bosqichli tasdiq. Telefonni ulang.</p></span></div><div><span><b>Tiklash raqami</b><p>Parol yo'qolsa qaytarish uchun telefon raqami qo'shiladi.</p></span></div></div>`,'Shaxsiy akkaunt bilan kirish tavsiya. Har kimning o\'z akkaunti bo\'lsin.');
add(`<div class="kick">1-dars · Kirish 2/3</div><h2>Gemini'ga <span class="acc">Google orqali</span> kirish</h2><div class="steps"><div><span><b>gemini.google.com</b><p>Brauzerda oching.</p></span></div><div><span><b>«Sign in» (Kirish)</b><p>Yuqori o'ngdagi tugma. Google akkauntingizni tanlang.</p></span></div><div><span><b>Shartlarni o'qing va davom eting</b><p>Chat oynasi ochiladi. Pastdagi maydonga yozing.</p></span></div></div><div class="card hl"><p><b>Sinov:</b> «Salom! Men drabilka bilan shug'ullanaman. O'zbek tilida o'zingni tanishtir.»</p></div>`);
add(`<div class="kick">1-dars · Kirish 3/3</div><h2>ChatGPT va Claude: <span class="acc">«Continue with Google»</span></h2><div class="grid g2"><div class="card"><span class="tag t-gr">ChatGPT</span><h3>chatgpt.com</h3><ul><li>«Log in» tugmasi</li><li>«Continue with Google»</li><li>Akkauntni tanlang</li></ul></div><div class="card"><span class="tag t-or">Claude</span><h3>claude.ai</h3><ul><li>Saytni oching</li><li>«Continue with Google»</li><li>Telefon raqamini tasdiqlang</li></ul></div></div><p>Uchalasiga bitta Google akkaunt bilan kirasiz. Telefonga ilovalarini ham o'rnating: ovozli rejim va rasmga olib so'rash juda qulay.</p>`,'Har kim uchalasiga kirib, bitta savol berib ko\'rsin. Kirolmaganlarga o\'sha zahoti yordam bering.');
add(`<div class="kick">1-dars · Asosiy g'oya</div><h2>Yomon so'rov — <span class="pk">yomon javob</span></h2><div class="grid g2"><div class="card"><span class="tag t-pk">Yomon</span><div class="quote" style="margin-top:14px">«Opalubka haqida yoz»</div><p style="margin-top:12px">Javob umumiy, foydasiz, ko'p ortiqcha gap.</p></div><div class="card hl"><span class="tag t-gr">Yaxshi</span><div class="quote" style="margin-top:14px;font-size:21px">«Sen ijara bo'yicha sotuvchisan. Mijozga opalubka ijarasi haqida 5 qatorlik xabar yoz. Narx: kuniga 3 000 so'm. Telegram uchun.»</div></div></div><p>Farq nimada? Ikkinchisida to'rtta narsa bor. Hozir ularni o'rganamiz.</p>`);
add(`<div class="kick">1-dars · Formula</div><h2>R-V-K-F <span class="or">formulasi</span></h2><div class="grid g4"><div class="card"><div class="letter or">R</div><h3>Rol</h3><p>AI kim bo'lsin? Sotuvchi, buxgalter, usta, tarjimon</p></div><div class="card"><div class="letter acc">V</div><h3>Vazifa</h3><p>Nima qilsin? Yoz, hisobla, solishtir, tarjima qil</p></div><div class="card"><div class="letter gr">K</div><h3>Kontekst</h3><p>Vaziyat: kim uchun, narx, shahar, maqsad</p></div><div class="card"><div class="letter pk">F</div><h3>Format</h3><p>Natija qanday ko'rinsin? Jadval, 5 qator, ro'yxat</p></div></div><p><b>Eslab qoling:</b> Rol + Vazifa + Kontekst + Format = yaxshi javob.</p>`,'Har harfni korxonadan misol bilan ayting. Doskaga 4 harfni yozdiring.');
add(`<div class="kick">1-dars · Misol</div><h2>Formula <span class="acc">amalda</span></h2><div class="code"><span class="k">ROL:</span> Sen xo'jalik mollari do'konining tajribali sotuvchisan.
<span class="k">VAZIFA:</span> Instagram uchun e'lon matni yoz.
<span class="k">KONTEKST:</span> Do'konimiz Farg'ona vodiysida. Yangi kelgan
  mahsulot: bolg'a to'plami, 2 yillik kafolat. Mijozlar: quruvchilar.
<span class="k">FORMAT:</span> 4 qator, oxirida telefon raqami uchun joy,
  3 ta xeshteg, o'zbek tilida, samimiy ohangda.</div><p>Bir xil formulani <b>har qanday</b> AI ga bering. Natijalarni solishtiring.</p>`);
add(`<div class="kick">1-dars · Sehrli iboralar</div><h2>Natijani <span class="gr">yaxshilash</span></h2><div class="grid g2"><div class="card"><h3>«Menga savol ber»</h3><p>«Yozishdan oldin menga 5 ta aniqlashtiruvchi savol ber.» AI sizdan kerakli ma'lumotni so'raydi.</p></div><div class="card"><h3>«Qadamma-qadam»</h3><p>Murakkab ishni bo'laklarga bo'lib bajartiring.</p></div><div class="card"><h3>«3 variant ber»</h3><p>Eng yaxshisini o'zingiz tanlaysiz.</p></div><div class="card"><h3>«Xatolarini top»</h3><p>Yozilgan matnni tanqid qildiring, keyin tuzattiring.</p></div></div>`);
add(`<div class="kick">1-dars · Amaliyot</div><h2>3 ta vazifa. <span class="or">Har kim o'zi.</span></h2><div class="steps"><div><span><b>Drabilka</b><p>Mijozga: «Mahsulot narxi qimmat» deganiga xushmuomala javob yozing.</p></span></div><div><span><b>Xo'jalik mollari do'koni</b><p>Yangi mahsulot uchun Telegram e'lon: rasmga olib Gemini'ga bering.</p></span></div><div><span><b>Opalubka ijarasi</b><p>Mijozga ijara shartlari bilan narx xabari, 5 qator.</p></span></div></div>`,'Har bir vazifa uchun R-V-K-F ni shart qiling. Tayyor bo\'lganda bir-birinikini o\'qishsin.');
add(`<div class="kick">1-dars · Yakun</div><h2>Uyga vazifa va <span class="gr">natija</span></h2><div class="grid g2"><div class="card"><span class="tag t-gr">Natija</span><h3>Bugun tayyor</h3><ul class="ok"><li>3 ta AI ga kirdingiz</li><li>R-V-K-F ni bilasiz</li><li>3 ta tayyor matn bor</li></ul></div><div class="card"><span class="tag t-or">Uyga vazifa</span><h3>Har kuni 10 daqiqa</h3><ul><li>Ish bo'yicha 5 ta savolni AI ga bering</li><li>Eng yaxshi so'rovingizni daftarga yozing</li><li>Keyingi darsga 1 ta rasm olib keling: dastgoh yoki mahsulot</li></ul></div></div>`);

add(`<div class="kick">2-dars · Solishtirish</div><h2>Dastgohlarni <span class="or">jadvalga</span> soling</h2><div class="card"><table><tr><th>Model</th><th>Quvvat</th><th>Narx</th><th>Kafolat</th><th>Ehtiyot qism</th></tr><tr><td>A modeli</td><td>...</td><td>...</td><td>...</td><td>...</td></tr><tr><td>B modeli</td><td>...</td><td>...</td><td>...</td><td>...</td></tr><tr><td>C modeli</td><td>...</td><td>...</td><td>...</td><td>...</td></tr></table></div><p>Jadvalni AI to'ldiradi, <b>raqamlarni siz manba bilan tekshirasiz.</b> Oxirida «Eng yaxshi 2 variantni tavsiya qil va sababini yoz» deb so'rang.</p>`);
add(`<div class="kick">2-dars · Xavfsizlik</div><h2>Sotuvchini <span class="pk">tekshirish</span></h2><div class="grid g2"><ul class="ok"><li>Kompaniya necha yildan beri ishlaydi</li><li>Zavod yoki oddiy dallol?</li><li>Haqiqiy sharhlar va videolar bormi</li><li>Ehtiyot qism va xizmat kafolati</li></ul><ul class="no"><li>Narx bozordan ancha past</li><li>Faqat oldindan to'lov so'raydi</li><li>Video yoki sertifikat berishdan qochadi</li><li>Shoshiltiradi: «Bugun oxirgi kun»</li></ul></div><div class="card hl"><p>AI dan so'rang: «Bu sotuvchida qanday xavf belgilari bor? Savollar ro'yxatini tuz.»</p></div>`);
add(`<div class="kick">2-dars · Aloqa</div><h2>Xitoy tilida <span class="acc">gaplashamiz</span></h2><div class="grid g3"><div class="card"><h3>Xat yozish</h3><p>O'zbekcha yozing, AI xitoycha va inglizchaga o'giradi. Qaytgan javobni qayta tarjima qiling.</p></div><div class="card"><h3>Ovozli tarjimon</h3><p>ChatGPT va Gemini ovozli rejimi bilan jonli tarjima.</p></div><div class="card"><h3>Texnik savollar</h3><p>«Dvigatel quvvati, pichoq materiali, kafolat muddati» kabi tayyor ro'yxat.</p></div></div>`);
add(`<div class="kick">2-dars · Yangiliklar</div><h2>Yangilikni <span class="gr">qanday kuzatamiz</span></h2><div class="grid g2"><div class="card"><h3>YouTube video mazmuni</h3><p>Videoning havolasini Gemini'ga bering: «Asosiy fikrlar va narxlarni ro'yxat qil.»</p></div><div class="card"><h3>NotebookLM</h3><p>Pasport, PDF va maqolalarni yuklang. Faqat shular asosida javob beradi.</p></div><div class="card"><h3>Haftalik digest</h3><p>«Shu hafta plastik qayta ishlash uskunalari bo'yicha 5 ta yangilik ber.»</p></div><div class="card"><h3>Kanallar</h3><p>Soha Telegram va YouTube kanallari ro'yxatini AI bilan tuzing.</p></div></div>`);
add(`<div class="kick">2-dars · Amaliyot</div><h2>O'z <span class="or">hisobotingiz</span></h2><div class="steps"><div><span><b>Kerak uskunani tanlang</b><p>Masalan, yangi drabilka yoki do'kon uchun asbob.</p></span></div><div><span><b>Deep Research bering</b><p>R-V-K-F bilan to'liq so'rov yozing.</p></span></div><div><span><b>Jadval va tavsiyani oling</b><p>3 ta variant, narx, xavf, savollar ro'yxati.</p></span></div><div><span><b>Tekshiring</b><p>Kamida 3 ta raqamni manbadan o'zingiz tasdiqlang.</p></span></div></div>`);
add(`<div class="kick">2-dars · Yakun</div><h2>AI xatosini <span class="pk">ushlash</span></h2><div class="grid g3"><div class="card"><div class="num or">1</div><h3>Manbani so'rang</h3><p>«Havola ber.» Havola ochilmasa, ishonmang.</p></div><div class="card"><div class="num acc">2</div><h3>Hisobni qayta qiling</h3><p>Narx va foizni kalkulyatorda tekshiring.</p></div><div class="card"><div class="num gr">3</div><h3>Ikkinchi AI ga ko'rsating</h3><p>«Bu javobda xato bormi?»</p></div></div><div class="card hl"><p><b>Uyga vazifa:</b> tanlagan uskuna bo'yicha sotuvchiga yuboriladigan 8 ta savol tuzing.</p></div>`);

add(`<div class="kick">3-dars · Hujjat</div><h2>Shartnoma va akt <span class="acc">5 daqiqada</span></h2><div class="code"><span class="k">ROL:</span> Sen qurilish uskunalari ijarasi bo'yicha menejersan.

add(`<div class="kick">3-dars · Jadval</div><h2>Excel yoki Sheets: <span class="or">formulani AI yozadi</span></h2><div class="grid g2"><div class="card"><h3>Qanday so'raladi</h3><p>«Google Sheets'da B2 – olingan sana, C2 – qaytgan sana, D2 – kunlik narx. Summa formulasini yoz.»</p></div><div class="card"><h3>AI beradi</h3><div class="code" style="font-size:18px">=(C2-B2)*D2</div><p style="margin-top:10px">Siz yopishtirasiz. Tushunmasangiz «Tushuntir» deysiz.</p></div></div><p>Kerak formulalar: <b>SUM, IF, COUNTIF, VLOOKUP</b>, kunlarni hisoblash. Nomini bilish shart emas, vazifani tushuntirsangiz bo'ladi.</p>`);
add(`<div class="kick">3-dars · Opalubka</div><h2>Ijara <span class="gr">kalkulyatori</span></h2><div class="card"><table><tr><th>Mijoz</th><th>Mahsulot</th><th>Soni</th><th>Narx/kun</th><th>Olingan</th><th>Qaytgan</th><th>Summa</th></tr><tr><td>Brigada 1</td><td>Plita</td><td>40</td><td>3 000</td><td>01.12</td><td>10.12</td><td class="gr">1 080 000</td></tr><tr><td>Brigada 2</td><td>Tayanch</td><td>20</td><td>2 000</td><td>03.12</td><td>—</td><td class="or">davom etyapti</td></tr></table></div><p>Raqamlar namuna sifatida. Haqiqiy narxlaringizni o'zingiz yozasiz.</p>`);
add(`<div class="kick">3-dars · Do'kon</div><h2>Narx ro'yxati va <span class="acc">ustama</span></h2><div class="grid g2"><div class="card"><h3>Muammo</h3><p>Tovar narxlari o'zgardi. 200 ta mahsulotga 15% ustama qo'yish kerak.</p></div><div class="card"><h3>AI yechimi</h3><p>«Tovar jadvalim bor: A – nomi, B – tannarx. C ustuniga 15% ustama bilan sotuv narxini hisobla va 100 ga yaxlitla.»</p></div></div><div class="card hl"><p><b>Qo'shimcha:</b> qoldiq 5 dan kam bo'lsa qizil rang bersin: «Shartli formatlash» ni AI ga tushuntirtiring.</p></div>`);
add(`<div class="kick">3-dars · Tahlil</div><h2>Jadvalga <span class="pk">savol berasiz</span></h2><p class="lead">Excel faylni, PDF yoki rasmni AI ga yuklang va oddiy tilda so'rang:</p><div class="grid g2"><div class="card"><ul><li>«Qaysi mahsulot eng ko'p foyda keltirdi?»</li><li>«Qaysi mijoz qarzdor?»</li></ul></div><div class="card"><ul><li>«Oylar bo'yicha diagramma chiz»</li><li>«Menga 5 qatorlik xulosa yoz»</li></ul></div></div><div class="card hl"><p><b>Eslatma:</b> mijozlarning telefon va shaxsiy ma'lumotini AI ga yuklashdan oldin o'chiring.</p></div>`);
add(`<div class="kick">3-dars · Amaliyot</div><h2>O'z <span class="or">jadvalingizni</span> yasang</h2><div class="steps"><div><span><b>Tanlang</b><p>Ijara kalkulyatori yoki narx ro'yxati.</p></span></div><div><span><b>Sheets'da jadval oching</b><p>Ustunlarni AI bilan rejalang.</p></span></div><div><span><b>Formulani AI dan oling</b><p>Kamida 3 ta formula ishlasin.</p></span></div><div><span><b>3 ta qatorni qo'lda tekshiring</b><p>Hisob to'g'rimi?</p></span></div></div><div class="card hl"><p><b>Uyga vazifa:</b> haqiqiy 10 ta ijara yozuvini jadvalga kiriting. 5-darsda aynan shu dasturga aylanadi.</p></div>`);

add(`<div class="kick">4-dars · Farq</div><h2>Chat va <span class="acc">Claude Code</span></h2><div class="grid g2"><div class="card"><span class="tag t-bl">Oddiy chat</span><h3>Maslahat beradi</h3><ul><li>Siz nusxa olasiz</li><li>Siz joylashtirasiz</li><li>Fayllarni ko'rmaydi</li></ul></div><div class="card hl"><span class="tag t-or">Claude Code</span><h3>O'zi bajaradi</h3><ul class="ok"><li>Papkangizdagi fayllarni o'qiydi</li><li>Fayl yozadi va tahrirlaydi</li><li>Dasturni ishga tushirib sinaydi</li></ul></div></div><p>Har muhim qadamdan oldin sizdan <b>ruxsat so'raydi</b>. Siz nazoratdasiz.</p>`);
add(`<div class="kick">4-dars · O'rnatish</div><h2>Claude Code'ni <span class="or">o'rnatamiz</span></h2><div class="steps"><div><span><b>Pullik obuna kerak</b><p>claude.ai da Pro tarifi. Claude Code bepul akkauntda ishlamaydi.</p></span></div><div><span><b>Windows: PowerShell oching</b><p>Boshlash menyusida «PowerShell» deb qidiring.</p></span></div><div><span><b>Buyruqni kiriting</b><div class="code" style="margin-top:8px;font-size:19px">irm https://claude.ai/install.ps1 | iex</div></span></div><div><span><b>Papkaga kirib ishga tushiring</b><p>Brauzer ochiladi, Google akkaunt bilan kirasiz.</p></span></div></div>`,'Buyruq o\'zgargan bo\'lishi mumkin. Dars oldidan docs.claude.com sahifasidan o\'rnatish buyrug\'ini tekshiring. Mac uchun alohida buyruq bor.');

 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{location.hash='dars-'+b.dataset.go});
 const sls=[...st.children];
 window.go=function(i){cur=Math.max(0,Math.min(sls.length-1,i));sls.forEach((e,j)=>e.classList.toggle('on',j===cur));
  [...dots.children].forEach((e,j)=>e.classList.toggle('on',j===cur));[...ol.children].forEach((e,j)=>e.classList.toggle('on',j===cur));
  document.getElementById('cnt').textContent=(cur+1)+' / '+sls.length;
  try{history.replaceState(null,'','#dars-'+n+'/'+(cur+1))}catch(e){}};
 window.fit=function(){
  if(document.fullscreenElement===pl){const s=Math.min(innerWidth/1280,innerHeight/720);pl.style.height='100vh';st.style.transform=`scale(${s})`;st.style.left=((innerWidth-1280*s)/2)+'px';st.style.top=((innerHeight-720*s)/2)+'px'}
  else{const s=pl.clientWidth/1280;pl.style.height=(720*s)+'px';st.style.transform=`scale(${s})`;st.style.left='0';st.style.top='0'}};
 window.addEventListener('resize',fit);document.addEventListener('fullscreenchange',()=>window.fit&&fit());
 document.getElementById('bp').onclick=()=>go(cur-1);document.getElementById('bn').onclick=()=>go(cur+1);
 document.getElementById('bt').onclick=()=>document.body.classList.toggle('notes');document.getElementById('thm').onclick=th;
 document.getElementById('bf').onclick=()=>{document.fullscreenElement?document.exitFullscreen():pl.requestFullscreen().catch(()=>{})};
 st.addEventListener('click',e=>{if(e.target.closest('a,button'))return;const r=st.getBoundingClientRect();go(cur+(e.clientX<r.left+r.width*0.25?-1:1))});
 let tx=0;pl.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
 pl.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)go(cur+(d<0?1:-1))});
 keyH=e=>{const k=e.key;if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(['ArrowRight','PageDown',' ','Enter'].includes(k)){e.preventDefault();go(cur+1)}
  else if(['ArrowLeft','PageUp','Backspace'].includes(k)){e.preventDefault();go(cur-1)}
  else if(k==='Home')go(0);else if(k==='End')go(sls.length-1);
  else if(k==='n'||k==='N')document.body.classList.toggle('notes');
  else if(k==='t'||k==='T')th();else if(k==='f'||k==='F')document.getElementById('bf').click()};
 fit();go(Math.max(0,(idx||1)-1));
}
addEventListener('keydown',e=>{if(keyH)keyH(e)});

/* ===== MAVZU VA YO'NALTIRISH ===== */
try{const sv=localStorage.getItem('theme');if(sv)document.documentElement.dataset.theme=sv}catch(e){}
function th(){const r=document.documentElement;r.dataset.theme=r.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('theme',r.dataset.theme)}catch(e){}}
function route(){
 const m=/^#dars-(\d{1,2})(?:\/(\d{1,2}))?$/.exec(location.hash);
 if(m){if(+m[1]===lesson&&document.getElementById('stage')){go((+m[2]||1)-1)}else{openLesson(+m[1],+m[2]);window.scrollTo(0,0)}}
 else if(location.hash==='#darslar'){if(!lesson&&document.getElementById('darslar')){document.getElementById('darslar').scrollIntoView()}else{home();document.getElementById('darslar').scrollIntoView()}}
 else{home();window.scrollTo(0,0)}
}
addEventListener('hashchange',route);route();
</script>
