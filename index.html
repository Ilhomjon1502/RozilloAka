<!doctype html>
<html lang="uz" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sun'iy intellekt: ish quroli</title>
<meta name="description" content="Ro'zillo aka jamoasi uchun 6 darslik amaliy AI kursi: ChatGPT, Gemini, Claude Code.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1020;--bg2:#0f1830;--card:#131d36;--line:#23304f;--tx:#eef2ff;--mut:#9aa8c9;--or:#ff9f43;--bl:#6b95ff;--gr:#3ecf8e;--pk:#ff6b9d;--code:#0a0f1d}
:root[data-theme=light]{--bg:#f4f6fb;--bg2:#fff;--card:#fff;--line:#d3d9ea;--tx:#0e1730;--mut:#44506e;--code:#0e1730;--or:#d4690a;--bl:#2a55d4;--gr:#0f8a53;--pk:#d02e69}
:root[data-theme=light] #stage{box-shadow:0 12px 50px rgba(30,50,100,.18);background:radial-gradient(1100px 600px at 85% -10%,rgba(42,85,212,.10),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(212,105,10,.08),transparent 60%),var(--bg)}
:root[data-theme=light] .card{box-shadow:0 2px 10px rgba(30,50,100,.07)}
:root[data-theme=light] #ui{background:rgba(255,255,255,.92)}
:root[data-theme=light] #grid{background:rgba(244,246,251,.97)}
:root[data-theme=light] .note{background:#e6f7ee;color:#0b3d27}
:root[data-theme=light] .code .c{color:#8fa0c8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:Nunito,system-ui,sans-serif}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:720px;position:relative;flex:none;transform-origin:center center;background:radial-gradient(1100px 600px at 85% -10%,rgba(107,149,255,.18),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(255,159,67,.13),transparent 60%),var(--bg);border-radius:18px;overflow:hidden;box-shadow:0 20px 80px rgba(0,0,0,.45)}
.slide{position:absolute;inset:0;padding:54px 72px 64px;display:none;flex-direction:column;justify-content:center;gap:22px}
.slide.on{display:flex;animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.kick{font-size:18px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--or)}
h1{font-size:78px;line-height:1.04;font-weight:900;letter-spacing:-.02em}
h2{font-size:50px;line-height:1.1;font-weight:900;letter-spacing:-.01em}
h3{font-size:28px;font-weight:800}
h3 a{color:var(--tx);text-decoration:none}h3 a:hover{color:var(--bl)}
p,li{font-size:26px;line-height:1.45;color:var(--mut)}
b,strong{color:var(--tx)}
.acc{color:var(--bl)}.or{color:var(--or)}.gr{color:var(--gr)}.pk{color:var(--pk)}
.lead{font-size:30px;color:var(--mut);max-width:900px}
.grid{display:grid;gap:18px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px}
.card h3{margin:6px 0 8px}.card p,.card li{font-size:23px}
.card.hl{border-color:var(--or);box-shadow:0 0 0 1px var(--or) inset}
.tag{display:inline-block;font-size:15px;font-weight:900;letter-spacing:.08em;padding:4px 10px;border-radius:99px;text-transform:uppercase}
.t-or{background:rgba(255,159,67,.18);color:var(--or)}.t-bl{background:rgba(107,149,255,.18);color:var(--bl)}.t-gr{background:rgba(62,207,142,.18);color:var(--gr)}.t-pk{background:rgba(255,107,157,.18);color:var(--pk)}
ul{list-style:none;display:grid;gap:8px}
ul li{padding-left:26px;position:relative}
ul li:before{content:"";position:absolute;left:4px;top:.6em;width:9px;height:9px;border-radius:50%;background:var(--bl)}
.ok li:before{background:var(--gr)}.no li:before{background:var(--pk)}
.num{font-size:68px;font-weight:900;line-height:1}
.letter{font-size:76px;font-weight:900;line-height:1}
.code{background:var(--code);border:1px solid var(--line);border-radius:14px;padding:18px 22px;font-family:'JetBrains Mono',monospace;font-size:21px;line-height:1.55;color:#cfe0ff;white-space:pre-wrap}
:root[data-theme=light] .code{color:#cfe0ff}
.code .k{color:var(--or)}.code .c{color:#7a8bb3}.code .g{color:var(--gr)}
.steps{display:grid;gap:14px;counter-reset:s}
.steps>div{counter-increment:s;display:flex;gap:18px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px}
.steps>div:before{content:counter(s);flex:none;width:46px;height:46px;border-radius:50%;background:var(--bl);color:#fff;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center}
.steps p{font-size:24px}.steps b{font-size:26px}
.steps{gap:10px}.steps>div{padding:10px 20px}.steps p{line-height:1.3}
.steps:has(>div:nth-child(5)) p{font-size:22px}.steps:has(>div:nth-child(5)) b{font-size:24px}.steps:has(>div:nth-child(5))>div{padding:8px 20px}
.bar{display:flex;height:64px;border-radius:14px;overflow:hidden;font-weight:800;color:#0a1020}
.bar div{display:flex;flex-direction:column;justify-content:center;padding:0 16px;font-size:17px}.bar div b{font-size:28px;color:#0a1020}
table{width:100%;border-collapse:collapse;font-size:23px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--or)}
td{color:var(--mut)}td:first-child{color:var(--tx);font-weight:800}
.quote{border-left:5px solid var(--or);padding:10px 22px;font-size:30px;font-weight:700;color:var(--tx)}
.chip{display:inline-block;padding:5px 12px;border-radius:99px;font-size:17px;font-weight:800}
.div{align-items:flex-start;justify-content:center;gap:16px}
.div .big{font-size:230px;font-weight:900;line-height:.8;color:transparent;-webkit-text-stroke:3px var(--bl);position:absolute;right:60px;top:70px;opacity:.55}
.wow{margin-top:18px;background:linear-gradient(135deg,rgba(255,159,67,.18),rgba(255,107,157,.12));border:1px solid var(--or);border-radius:18px;padding:18px 26px;max-width:860px}
.wow .kick{margin-bottom:4px}.wow p{color:var(--tx);font-size:27px;font-weight:700}
.mock{background:#fff;border-radius:14px;overflow:hidden;color:#0e1730;border:1px solid var(--line)}
.mock .top{background:#0e1730;color:#fff;padding:10px 16px;font-weight:800;display:flex;justify-content:space-between;font-size:19px}
.mock table{font-size:18px}.mock td{color:#334}.mock td:first-child{color:#0e1730}.mock th{color:#6b7694}
.st{padding:3px 10px;border-radius:99px;font-size:15px;font-weight:900}
.s-ok{background:#d9f7e8;color:#0d7a4a}.s-late{background:#ffe0e0;color:#b3261e}.s-act{background:#dfe8ff;color:#2848b0}
.note{display:none;position:absolute;left:72px;right:72px;bottom:70px;background:#1b2a1f;border:1px solid var(--gr);color:#d6ffe8;border-radius:12px;padding:12px 18px;font-size:20px;line-height:1.4;z-index:5}
body.notes .note{display:block}
.sp{flex:1}
#ui{position:fixed;left:0;right:0;bottom:0;height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;background:rgba(10,16,32,.85);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:20;transition:opacity .3s}
#ui.hide{opacity:0}
#ui button{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font:800 16px Nunito;cursor:pointer}
#ui button:hover{border-color:var(--or)}
#pg{flex:1;height:6px;background:var(--line);border-radius:9px;overflow:hidden;cursor:pointer}#pgf{height:100%;width:0;background:linear-gradient(90deg,var(--or),var(--pk));transition:width .3s}
#cnt{font:800 16px Nunito;color:var(--mut);min-width:64px;text-align:center}
#grid{position:fixed;inset:0;background:rgba(5,8,18,.96);z-index:30;display:none;overflow:auto;padding:30px}
#grid.on{display:block}
#grid .gi{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
#grid button{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px;text-align:left;font:700 14px Nunito;cursor:pointer;min-height:70px}
#grid button small{display:block;color:var(--or);font-size:11px;letter-spacing:.1em;margin-bottom:4px}
#grid button:hover{border-color:var(--bl)}
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="ui"><button id="bp">←</button><button id="bn">→</button><div id="pg"><div id="pgf"></div></div><span id="cnt"></span><button id="bg" title="G">Reja</button><button id="bt" title="N">Eslatma</button><button id="bth" title="T">Mavzu</button><button id="bf" title="F">⛶</button></div>
<div id="grid"><div class="gi" id="gi"></div></div>

<script>
const S=[]; // slides
const add=(h,n,cls)=>S.push({h,n:n||'',cls:cls||''});
const div=(n,t,goal,wow,note)=>add(`<div class="big">${n}</div><div class="kick">${n}-dars</div><h1>${t}</h1><p class="lead">${goal}</p><div class="wow"><div class="kick">Bugungi «VAU»</div><p>${wow}</p></div>`,note,'div');

/* ===== KIRISH ===== */
add(`<div class="kick">Ro'zillo aka jamoasi uchun · 6 dars</div><h1>Sun'iy intellekt:<br><span class="acc">ish quroli</span></h1><p class="lead">Drabilka, xo'jalik mollari do'koni va opalubka ijarasi uchun amaliy kurs. AI ga yozishdan tortib, o'zingizning dasturingizni yasashgacha.</p><div class="grid g4" style="margin-top:10px"><div class="card"><span class="tag t-or">ChatGPT</span></div><div class="card"><span class="tag t-bl">Gemini</span></div><div class="card"><span class="tag t-gr">Claude</span></div><div class="card"><span class="tag t-pk">Claude Code</span></div></div>`,'Boshlashdan oldin: bu kurs nazariya emas, har dars oxirida korxonaga yaraydigan tayyor natija chiqadi. Shuni ayting.');
add(`<div class="kick">Nega bu kurs</div><h2>AI sizning jamoangizda <span class="acc">4 ta ishchi</span> bo'ladi</h2><div class="grid g4"><div class="card"><div class="num or">1</div><h3>Yozadi</h3><p>Shartnoma, e'lon, mijozga xabar, xitoycha xat</p></div><div class="card"><div class="num acc">2</div><h3>Hisoblaydi</h3><p>Ijara summasi, tannarx, foyda, Excel formulalari</p></div><div class="card"><div class="num gr">3</div><h3>O'qiydi</h3><p>Dastgoh pasporti, rasm, PDF, jadval, video</p></div><div class="card"><div class="num pk">4</div><h3>Yasaydi</h3><p>Hisob dasturi, bot, sayt. Kod yozmasdan</p></div></div>`);
add(`<div class="kick">Kurs xaritasi</div><h2>6 dars, <span class="acc">6 ta tayyor natija</span></h2><div class="grid g3"><div class="card hl"><span class="tag t-or">1-dars</span><h3>AI bilan ishlash</h3><p>Google orqali kirish, R-V-K-F formulasi</p></div><div class="card"><span class="tag t-bl">2-dars</span><h3>Dunyo va Xitoy texnikasi</h3><p>Dastgohlarni topish, solishtirish, tarjima</p></div><div class="card"><span class="tag t-gr">3-dars</span><h3>Hujjat va jadval</h3><p>Shartnoma, narx ro'yxati, ijara kalkulyatori</p></div><div class="card"><span class="tag t-pk">4-dars</span><h3>Claude Code</h3><p>O'rnatish, kompyuterni boshqarish</p></div><div class="card"><span class="tag t-or">5-dars</span><h3>1-dastur: ijara tizimi</h3><p>Opalubka ijarasini hisoblaydigan dastur</p></div><div class="card"><span class="tag t-bl">6-dars</span><h3>2-dastur va chiqarish</h3><p>Do'kon, drabilka yoki bot. Himoya va sertifikat</p></div></div>`);
add(`<div class="kick">Kurs oxirida</div><h2>Siz bularni <span class="gr">qila olasiz</span></h2><div class="grid g2"><ul class="ok"><li>ChatGPT, Gemini va Claude'ga kirish va to'g'ri so'rov yozish</li><li>Xitoy dastgohlarini topish, tarjima qilish, solishtirish</li><li>Shartnoma va hisobotni AI bilan 5 daqiqada tayyorlash</li></ul><ul class="ok"><li>Claude Code'ni o'rnatish va o'zingiz ishlatish</li><li>Kompyuterni AI ga boshqartirish</li><li>O'z korxonangiz uchun ishlaydigan dastur yasash</li></ul></div>`);
add(`<div class="kick">Dars tartibi</div><h2>Har dars <span class="acc">2 soat</span></h2><div class="bar"><div style="background:#eef2ff;width:12%"><b>15</b>nazariya</div><div style="background:#ff9f43;width:18%"><b>20</b>namoyish</div><div style="background:#6b95ff;width:50%"><b>60</b>o'zingiz qilasiz</div><div style="background:#3ecf8e;width:12%"><b>15</b>natija</div><div style="background:#ff6b9d;width:8%"><b>10</b>vazifa</div></div><p>Har dars bitta aniq natija bilan tugaydi. O'z noutbukingizda, o'z ishingiz misolida ishlaysiz. Ko'rib qo'ya qolmaysiz, o'zingiz bosasiz.</p>`);
add(`<div class="kick">Tayyorgarlik</div><h2>Birinchi darsgacha <span class="or">nima kerak</span></h2><div class="grid g4"><div class="card"><h3>Noutbuk</h3><p>Windows yoki Mac, internet bilan</p></div><div class="card"><h3>Gmail</h3><p>Shaxsiy Google akkaunt. Yo'q bo'lsa 1-darsda ochamiz</p></div><div class="card"><h3>Telefon</h3><p>Tasdiqlash kodi keladigan raqam bilan</p></div><div class="card"><h3>Visa karta</h3><p>4-darsdan oldin kerak. Pullik obuna uchun</p></div></div>`,'Obuna to\'lovi uchun karta masalasini oldindan hal qilishni ayting. Hududda xizmatlar mavjudligini oldindan tekshiring.');

/* ===== 1-DARS ===== */
div('1','AI bilan ishlash','Akkauntga kirish, AI ni tanlash va to\'g\'ri so\'rov yozish formulasi.','Bir daqiqada mijozga tayyor, chiroyli narx e\'loni yozdirib ko\'rasiz.');
add(`<div class="kick">1-dars · Asos</div><h2>AI nima? <span class="acc">3 oddiy qoida</span></h2><div class="grid g3"><div class="card"><div class="num or">1</div><h3>U yordamchi</h3><p>O'ta bilimli, lekin sizning korxonangizni bilmaydi. Hammasini tushuntirish kerak.</p></div><div class="card"><div class="num acc">2</div><h3>U xato qiladi</h3><p>Ishonch bilan noto'g'ri gapirishi mumkin. Narx va raqamni doim tekshiring.</p></div><div class="card"><div class="num pk">3</div><h3>U sir saqlamaydi</h3><p>Parol, karta raqami va mijoz sirlarini yozmang.</p></div></div>`);
add(`<div class="kick">1-dars · Tanlov</div><h2>Qaysi AI <span class="acc">nima uchun</span></h2><div class="card"><table><tr><th>AI</th><th>Kuchli tomoni</th><th>Bizda qayerda</th></tr><tr><td>ChatGPT</td><td>Yozish, g'oya, ovozli suhbat</td><td>Mijozga xabar, e'lon</td></tr><tr><td>Gemini</td><td>Google bilan bog'liq, rasm va video, tarjima</td><td>Xitoycha pasport, Sheets</td></tr><tr><td>Claude</td><td>Uzun hujjat, aniq yozuv, kod</td><td>Shartnoma, tahlil</td></tr><tr><td>Claude Code</td><td>Kompyuteringizda ishlaydi, dastur yasaydi</td><td>4-6 darslar</td></tr></table></div><p>Bittasini yaxshi o'rganing, qolganlarini solishtirish uchun ishlating.</p>`);
add(`<div class="kick">1-dars · Kirish 1/3</div><h2>Google akkaunt <span class="acc">tayyorlaymiz</span></h2><div class="steps"><div><span><b>accounts.google.com</b><p>Yangi akkaunt oching yoki bor Gmail'dan foydalaning.</p></span></div><div><span><b>Kuchli parol</b><p>Kamida 12 belgi, ism va tug'ilgan yilsiz. Daftarga emas, parol menejeriga saqlang.</p></span></div><div><span><b>2 bosqichli tasdiq (2FA)</b><p>Google sozlamalarida Xavfsizlik, keyin 2 bosqichli tasdiq. Telefonni ulang.</p></span></div><div><span><b>Tiklash raqami</b><p>Parol yo'qolsa qaytarish uchun telefon raqami qo'shiladi.</p></span></div></div>`,'Shaxsiy akkaunt bilan kirish tavsiya. Har kimning o\'z akkaunti bo\'lsin.');
add(`<div class="kick">1-dars · Kirish 2/3</div><h2>Gemini'ga <span class="acc">Google orqali</span> kirish</h2><div class="steps"><div><span><b>gemini.google.com</b><p>Brauzerda oching.</p></span></div><div><span><b>«Sign in» (Kirish)</b><p>Yuqori o'ngdagi tugma. Google akkauntingizni tanlang.</p></span></div><div><span><b>Shartlarni o'qing va davom eting</b><p>Chat oynasi ochiladi. Pastdagi maydonga yozing.</p></span></div></div><div class="card hl"><p><b>Sinov:</b> «Salom! Men drabilka bilan shug'ullanaman. O'zbek tilida o'zingni tanishtir.»</p></div>`);
add(`<div class="kick">1-dars · Kirish 3/3</div><h2>ChatGPT va Claude: <span class="acc">«Continue with Google»</span></h2><div class="grid g2"><div class="card"><span class="tag t-gr">ChatGPT</span><h3>chatgpt.com</h3><ul><li>«Log in» tugmasi</li><li>«Continue with Google»</li><li>Akkauntni tanlang</li></ul></div><div class="card"><span class="tag t-or">Claude</span><h3>claude.ai</h3><ul><li>Saytni oching</li><li>«Continue with Google»</li><li>Telefon raqamini tasdiqlang</li></ul></div></div><p>Uchalasiga bitta Google akkaunt bilan kirasiz. Telefonga ilovalarini ham o'rnating: ovozli rejim va rasmga olib so'rash juda qulay.</p>`,'Har kim uchalasiga kirib, bitta savol berib ko\'rsin. Kirolmaganlarga o\'sha zahoti yordam bering.');
add(`<div class="kick">1-dars · Asosiy g'oya</div><h2>Yomon so'rov — <span class="pk">yomon javob</span></h2><div class="grid g2"><div class="card"><span class="tag t-pk">Yomon</span><div class="quote" style="margin-top:14px">«Opalubka haqida yoz»</div><p style="margin-top:12px">Javob umumiy, foydasiz, ko'p ortiqcha gap.</p></div><div class="card hl"><span class="tag t-gr">Yaxshi</span><div class="quote" style="margin-top:14px;font-size:21px">«Sen ijara bo'yicha sotuvchisan. Mijozga opalubka ijarasi haqida 5 qatorlik xabar yoz. Narx: kuniga 3 000 so'm. Telegram uchun.»</div></div></div><p>Farq nimada? Ikkinchisida to'rtta narsa bor. Hozir ularni o'rganamiz.</p>`);
add(`<div class="kick">1-dars · Formula</div><h2>R-V-K-F <span class="or">formulasi</span></h2><div class="grid g4"><div class="card"><div class="letter or">R</div><h3>Rol</h3><p>AI kim bo'lsin? Sotuvchi, buxgalter, usta, tarjimon</p></div><div class="card"><div class="letter acc">V</div><h3>Vazifa</h3><p>Nima qilsin? Yoz, hisobla, solishtir, tarjima qil</p></div><div class="card"><div class="letter gr">K</div><h3>Kontekst</h3><p>Vaziyat: kim uchun, narx, shahar, maqsad</p></div><div class="card"><div class="letter pk">F</div><h3>Format</h3><p>Natija qanday ko'rinsin? Jadval, 5 qator, ro'yxat</p></div></div><p><b>Eslab qoling:</b> Rol + Vazifa + Kontekst + Format = yaxshi javob.</p>`,'Har harfni korxonadan misol bilan ayting. Doskaga 4 harfni yozdiring.');
add(`<div class="kick">1-dars · Misol</div><h2>Formula <span class="acc">amalda</span></h2><div class="code"><span class="k">ROL:</span> Sen xo'jalik mollari do'konining tajribali sotuvchisan.
<span class="k">VAZIFA:</span> Instagram uchun e'lon matni yoz.
<span class="k">KONTEKST:</span> Do'konimiz Farg'ona vodiysida. Yangi kelgan
  mahsulot: bolg'a to'plami, 2 yillik kafolat. Mijozlar: quruvchilar.
<span class="k">FORMAT:</span> 4 qator, oxirida telefon raqami uchun joy,
  3 ta xeshteg, o'zbek tilida, samimiy ohangda.</div><p>Bir xil formulani <b>har qanday</b> AI ga bering. Natijalarni solishtiring.</p>`);
add(`<div class="kick">1-dars · Sehrli iboralar</div><h2>Natijani <span class="gr">yaxshilash</span></h2><div class="grid g2"><div class="card"><h3>«Menga savol ber»</h3><p>«Yozishdan oldin menga 5 ta aniqlashtiruvchi savol ber.» AI sizdan kerakli ma'lumotni so'raydi.</p></div><div class="card"><h3>«Qadamma-qadam»</h3><p>Murakkab ishni bo'laklarga bo'lib bajartiring.</p></div><div class="card"><h3>«3 variant ber»</h3><p>Eng yaxshisini o'zingiz tanlaysiz.</p></div><div class="card"><h3>«Xatolarini top»</h3><p>Yozilgan matnni tanqid qildiring, keyin tuzattiring.</p></div></div>`);

<span class="k">FORMAT:</span> Katta tugmalar, o'zbek tilida, oddiy ko'rinish.</div>`);
add(`<div class="kick">5-dars · Bosqichlar</div><h2>Qadam <span class="or">ketma-ketligi</span></h2><div class="steps"><div><span><b>Asosiy sahifa</b><p>Ijara qo'shish formasi va ro'yxat.</p></span></div><div><span><b>Hisob</b><p>Summa o'zi hisoblansin. 3 ta misolni qo'lda tekshiring.</p></span></div><div><span><b>Qaytarish tugmasi</b><p>Qaytarilganda holat o'zgarsin.</p></span></div><div><span><b>Qarzdorlar</b><p>Muddati o'tganlar qizil rangda chiqsin.</p></span></div><div><span><b>Excelga yuklash</b><p>Hisobotni fayl qilib saqlash.</p></span></div></div>`);
add(`<div class="kick">5-dars · Xatolar</div><h2>Ishlamasa <span class="pk">nima qilamiz</span></h2><div class="grid g3"><div class="card"><h3>Xatoni ko'rsating</h3><p>Ekranning skrinshotini oling va AI ga bering: «Shu xatoni tuzat.»</p></div><div class="card"><h3>Aniq yozing</h3><p>«Ishlamayapti» emas, «Qaytarish bosilsa summa o'zgarmayapti» deng.</p></div><div class="card"><h3>Kichik qadam</h3><p>Bir vaqtda bitta narsani o'zgartiring.</p></div></div><p>Xato qilish — jarayonning normal qismi. Dasturchilar ham shunday ishlaydi.</p>`);
add(`<div class="kick">5-dars · Zaxira</div><h2>Ishingizni <span class="gr">saqlaymiz</span></h2><div class="grid g2"><div class="card"><h3>Har qadamdan keyin</h3><p>Fayl nusxasini «versiya1», «versiya2» nomi bilan saqlang yoki Claude Code'dan «Git bilan saqla» deb so'rang.</p></div><div class="card"><h3>Ma'lumot zaxirasi</h3><p>Excelga yuklab, Google Drive'ga qo'yib turing. Brauzer tozalansa, ma'lumot yo'qolmasin.</p></div></div>`);
add(`<div class="kick">5-dars · Amaliyot</div><h2>Dasturni <span class="or">yakunlaymiz</span></h2><div class="steps"><div><span><b>3-darsdagi haqiqiy yozuvlarni kiriting</b></span></div><div><span><b>Telefonda oching</b><p>Faylni o'zingizga yuboring yoki Drive'dan oching.</p></span></div><div><span><b>Bitta yangi imkoniyat qo'shing</b><p>O'zingiz o'ylab toping. Masalan: mijozga WhatsApp xabar tugmasi.</p></span></div></div><div class="card hl"><p><b>Uyga vazifa:</b> haftasiga 5 ta haqiqiy ijarani shu dasturga yozing va nima qulay emasligini belgilang.</p></div>`);

add(`<div class="kick">6-dars · Tanlov</div><h2>Qaysi <span class="acc">dastur</span> yasaymiz</h2><div class="grid g3"><div class="card"><span class="tag t-or">Do'kon</span><h3>Tovar qoldig'i</h3><p>Kirim, chiqim, kam qolgan tovar ro'yxati.</p></div><div class="card"><span class="tag t-bl">Drabilka</span><h3>Tannarx kalkulyatori</h3><p>Xomashyo, elektr, ish haqi kirsa, tannarx va foyda chiqadi.</p></div><div class="card"><span class="tag t-gr">Telegram bot</span><h3>Narx boti</h3><p>Mijoz bot orqali narx va ijara shartlarini so'raydi.</p></div></div>`);
add(`<div class="kick">6-dars · Drabilka</div><h2>Tannarx <span class="or">kalkulyatori</span></h2><div class="grid g2"><div class="card"><h3>Kiritiladi</h3><ul><li>Xomashyo narxi (kg)</li><li>Chiqish foizi</li><li>Elektr va ish haqi</li><li>Sotuv narxi</li></ul></div><div class="card"><h3>Chiqadi</h3><ul class="ok"><li>1 kg tannarx</li><li>Foyda va foiz</li><li>Oylik prognoz</li></ul></div></div><p>Formulalarni avval Excel'da tekshiring, keyin dastur qilishni so'rang.</p>`);
add(`<div class="kick">6-dars · Bot</div><h2>Telegram <span class="pk">bot</span></h2><div class="steps"><div><span><b>@BotFather</b><p>Telegram'da bot yaratib nom va token olasiz.</p></span></div><div><span><b>Token — bu parol</b><p>Uni hech kimga, hatto AI chatiga ham yozmang. Claude Code'ga «.env faylga yoz» deb ayting.</p></span></div><div><span><b>Claude Code bilan yozdiring</b><p>«/narx deb yozilsa narx ro'yxatini ko'rsat.»</p></span></div></div>`,'Bot ishga tushishi uchun uni doim yoqiq turadigan joyda ishlatish kerak. Bu darsda faqat sinov rejimi.');
add(`<div class="kick">6-dars · Chiqarish</div><h2>Dasturni <span class="acc">internetga</span> chiqarish</h2><div class="grid g2"><div class="card"><h3>Faqat o'zingiz uchun</h3><p>Fayl kompyuterda qoladi. Eng xavfsiz yo'l, ma'lumot tashqariga chiqmaydi.</p></div><div class="card"><h3>Hammaga ochiq sayt</h3><p>GitHub Pages yoki Netlify bepul. Lekin <b>narx, mijoz ro'yxati kabi maxfiy narsani qo'ymang.</b></p></div></div>`);
add(`<div class="kick">6-dars · Xavfsizlik</div><h2>6 ta <span class="pk">oltin qoida</span></h2><div class="grid g3"><div class="card"><div class="num or">1</div><p>Parol va tokenni AI ga yozmang</p></div><div class="card"><div class="num acc">2</div><p>Mijoz ma'lumotini yuklashdan oldin o'chiring</p></div><div class="card"><div class="num gr">3</div><p>Raqam va narxni o'zingiz tekshiring</p></div><div class="card"><div class="num pk">4</div><p>Muhim fayllarning nusxasini saqlang</p></div><div class="card"><div class="num or">5</div><p>Noma'lum havola va fayllarni yuklamang</p></div><div class="card"><div class="num acc">6</div><p>Pul o'tkazmasini AI ga topshirmang</p></div></div>`);
add(`<div class="kick">6-dars · Obunalar</div><h2>Qaysi obuna <span class="or">kerak</span></h2><div class="card"><table><tr><th>Xizmat</th><th>Taxminiy narx</th><th>Kerakmi</th></tr><tr><td>Claude Pro</td><td>~$20/oy</td><td>Ha, Claude Code uchun</td></tr><tr><td>ChatGPT, Gemini</td><td>Bepul variant bor, pullisi ~$20/oy</td><td>Boshida bepuli yetadi</td></tr></table></div><p>Narxlar o'zgarishi mumkin. Sayt orqali tekshiring. Obunani korxona hisobidan olish va har kimga alohida akkaunt ochish tavsiya.</p>`);
add(`<div class="kick">6-dars · Kelgusi yo'l</div><h2>Keyingi <span class="gr">30 kun</span></h2><div class="grid g3"><div class="card"><span class="tag t-or">1-hafta</span><p>Har kuni AI bilan 1 ta ish vazifasi.</p></div><div class="card"><span class="tag t-bl">2-hafta</span><p>Ijara dasturini haqiqiy ishda ishlating.</p></div><div class="card"><span class="tag t-gr">3-hafta</span><p>Yangi imkoniyat qo'shing. Do'kon yoki drabilka.</p></div></div><div class="card hl"><p><b>4-hafta:</b> hammasi nimani tejaganini sanang. Soat va pulda. Natijani birga ko'ramiz.</p></div>`);
add(`<div class="kick">6-dars · Himoya</div><h2>Yakuniy <span class="or">himoya</span></h2><div class="steps"><div><span><b>5 daqiqa</b><p>Har kim o'z dasturini ko'rsatadi.</p></span></div><div><span><b>Nima tejaydi?</b><p>Soat va pulda taxminiy hisob.</p></span></div><div><span><b>Keyingi qadam</b><p>Qaysi ishni keyingi bo'lib AI ga topshiramiz?</p></span></div></div>`);
add(`<div class="kick">Tabriklaymiz</div><h1>Endi siz <span class="acc">AI bilan</span><br>ishlay olasiz</h1><p class="lead">4 kishi, 6 dars, o'z dasturingiz. Savol bo'lsa, ustoz doim aloqada.</p><div class="grid g3"><div class="card"><span class="tag t-or">Sertifikat</span><p>Kurs bitirganlik haqida.</p></div><div class="card"><span class="tag t-bl">Yordam</span><p>Kursdan keyin ham savollarga javob.</p></div><div class="card"><span class="tag t-gr">Ustoz</span><p>Ilhomjon</p></div></div>`);

/* ===== ENGINE ===== */
const st=document.getElementById('stage'),gi=document.getElementById('gi');
S.forEach((s,i)=>{const d=document.createElement('section');d.className='slide '+s.cls;d.innerHTML=s.h+(s.n?`<div class="note"><b>Ustoz uchun:</b> ${s.n}</div>`:'');st.appendChild(d);
 const t=(d.querySelector('h1,h2')||{}).textContent||'';const k=(d.querySelector('.kick')||{}).textContent||'';
 const b=document.createElement('button');b.innerHTML=`<small>${i+1}. ${k}</small>${t}`;b.onclick=()=>{go(i);gridT(false)};gi.appendChild(b)});
const sl=[...st.children];let cur=0;
function go(i){cur=Math.max(0,Math.min(sl.length-1,i));sl.forEach((e,j)=>e.classList.toggle('on',j===cur));document.getElementById('pgf').style.width=((cur+1)/sl.length*100)+'%';document.getElementById('cnt').textContent=(cur+1)+' / '+sl.length;try{history.replaceState(null,'','#'+(cur+1))}catch(e){}}
function fit(){const s=Math.min(innerWidth/1280,(innerHeight-52)/720);st.style.transform=`scale(${s})`;document.getElementById('viewport').style.bottom='52px'}
addEventListener('resize',fit);fit();
function gridT(v){document.getElementById('grid').classList.toggle('on',v)}
try{const sv=localStorage.getItem('theme');if(sv)document.documentElement.dataset.theme=sv}catch(e){}
const th=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('theme',r.dataset.theme)}catch(e){}};
const fs=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});
addEventListener('keydown',e=>{const k=e.key;
 if(['ArrowRight','PageDown',' ','Enter'].includes(k)){e.preventDefault();go(cur+1)}
 else if(['ArrowLeft','PageUp','Backspace'].includes(k)){e.preventDefault();go(cur-1)}
 else if(k==='Home')go(0);else if(k==='End')go(sl.length-1);
 else if(k==='g'||k==='G'||k==='Escape')gridT(k==='Escape'?false:!document.getElementById('grid').classList.contains('on'));
 else if(k==='n'||k==='N')document.body.classList.toggle('notes');
 else if(k==='t'||k==='T')th();else if(k==='f'||k==='F')fs()});
document.getElementById('bp').onclick=()=>go(cur-1);document.getElementById('bn').onclick=()=>go(cur+1);
document.getElementById('bg').onclick=()=>gridT(true);document.getElementById('bt').onclick=()=>document.body.classList.toggle('notes');
document.getElementById('bth').onclick=th;document.getElementById('bf').onclick=fs;
document.getElementById('pg').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();go(Math.floor((e.clientX-r.left)/r.width*sl.length))};
let tx=0;addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)go(cur+(d<0?1:-1))});
st.addEventListener('click',e=>{if(e.target.closest('a,button'))return;const r=st.getBoundingClientRect();go(cur+(e.clientX<r.left+r.width*0.25?-1:1))});
go((parseInt(location.hash.slice(1))||1)-1);
</script>
